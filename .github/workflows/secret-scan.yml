# 提交扫密钥（gitleaks）。2026-10-19 由仓库所有者要求加上。
#
# - 只扫这次新增的提交：PR 扫 base..head；推送到默认分支扫这次推上来的那一段（before..after）。
#   不扫全部历史，也不会拦住任何推送 —— 它只在事后亮红灯。
# - 不用第三方 Action、不要许可证、不用任何 secrets：直接下载 gitleaks 官方发布包，
#   先和下面写死的 sha256 比，再和官方 checksums 文件比，两处对不上就停。
# - --redact：日志里只有规则名、文件和行号，不显示密钥本身（公开仓库的日志谁都能看）。
# - 扫描规则只用 gitleaks 自带的默认规则：仓库里的 .gitleaks.toml / .gitleaksignore 在扫描前会被移走，
#   免得一个 PR 顺手把规则改松。要加例外，改这个文件，由所有者批准。
# - 红了怎么办：先把那个密钥作废、换新的，再处理提交。删提交、改历史都不等于密钥安全。
#   不要为了变绿去加 gitleaks:allow。
# - 升级 gitleaks：同时改 GITLEAKS_VERSION 和 GITLEAKS_SHA256（取自该版本官方 checksums 文件里 linux_x64 那一行）。
# - run 块里不写表达式插值，所有值都经 env 传入。
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned version, sha256 verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$dir"
          cd "$dir"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL --retry 3 -o "$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o "$sums" "$base/$sums"
          # 1) 和本文件里写死的哈希比
          echo "$GITLEAKS_SHA256  $tarball" | sha256sum -c -
          # 2) 和官方 checksums 文件里的那一行比：必须正好一行、哈希相同、校验通过
          awk -v f="$tarball" '$2 == f' "$sums" > expected.txt
          test "$(wc -l < expected.txt)" -eq 1
          test "$(cut -d' ' -f1 expected.txt)" = "$GITLEAKS_SHA256"
          sha256sum -c expected.txt
          tar -xzf "$tarball" gitleaks
          ./gitleaks version
          echo "$dir" >> "$GITHUB_PATH"

      - name: Scan only the new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          for f in .gitleaks.toml .gitleaksignore; do
            if [ -e "$f" ]; then
              echo "::notice::扫描只用 gitleaks 默认规则，忽略仓库里的 $f"
              rm -f "$f"
            fi
          done
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ -n "$PUSH_BEFORE" ] \
            && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            echo "::warning::找不到推送前的提交（新分支或强推），只扫最新这一个提交"
            range="$PUSH_AFTER^!"
          fi
          echo "扫描范围：$range"
          gitleaks git --redact --no-banner --log-opts="$range" .
